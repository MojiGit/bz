<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" 
    content="
    Delta is a Web3 investing platform for on-chain OTC options.
    Design, simulate, and execute custom DeFi option strategies
    with real-time pricing and non-custodial trading.">
  <meta name="keywords" content="
    Web3 investing, 
    DeFi options, 
    OTC derivatives, 
    on-chain options, 
    smart contracts, 
    crypto hedging, 
    decentralized finance, 
    options trading, 
    blockchain trading, 
    DeFi tools
    DeFi, 
    Options, 
    Blockchain, 
    Derivatives, 
    OTC">
  <meta name="author" content="Delta Web3 Finance Team">
  <title>Delta | DeFi Options Strategy buildier </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./mvp-style-manifesto.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body class="bg-gray-100 text-black text-[18px]">


    <!-- Navbar -->
    <div class="relative">        
        <nav id="main-navbar"
            class="static top-4 left-2 right-2 mt-2 mx-2 px-4 bg-white border border-[#D8DDEF] rounded-full flex items-center justify-between">
            <!-- Logo -->
            <a href="./index.html" class="flex items-center gap-2 px-2" style="font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:19px; color:#191308; text-decoration:none;">
            <span style="display:inline-block; width:10px; height:10px; background:#00E083;"></span>
            ZERO DELTA
            </a>

            <div class="flex-1"></div>

            <!--Menu button -->
            <div class="md:hidden flex items-center p-2">
                <button id="mobile-menu-button" class="text-black focus:outline-none">
                <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                </button>
            </div>
        </nav>
        <!-- mobile menu -->
        <div id="mobile-menu"
            class="fixed top-[72px] left-0 right-0 mx-5 p-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl text-black font-semibold opacity-0 pointer-events-none z-40">
            <ul class="space-y-4 text-[18px]">
            <li><a target="_blank" rel="noopener noreferrer" href="https://m-mojica-mateuss-organization.gitbook.io/betazero-1/" class="px-1">Docs</a></li>
            </ul>
        </div>
    </div>
    
    <!-- Dashboard -->
    <!-- Single column on phones: the 340px track plus a chart column overflows a ~390px
         viewport horizontally. Side-by-side returns at md. -->
    <section id="dashboard" class="grid grid-cols-1 md:grid-cols-[340px_minmax(0,1fr)] gap-3 p-3">

        <!-- Left column: menu options and strategy builder share this column, only one visible at a time -->
        <div>

            <!--menu options-->
            <!-- On phones the panel wraps its content (header + filters + the capped list)
                 rather than claiming a slice of the viewport, so nothing below it is pushed
                 off screen. dvh at md is irrelevant; the desktop fixed height is unchanged. -->
            <div id="menu" class="w-full border border-[#D8DDEF] rounded-[10px] bg-white overflow-hidden h-auto md:h-[calc(100vh_-_104px)] flex flex-col">

                <!-- Header (fixed, does not scroll) -->
                <div class="flex flex-row items-center justify-between p-2 border-b border-[#D8DDEF]">
                    <h1 class="text-[13px] tracking-[0.08em] uppercase font-semibold text-[#191308]">
                        <span class="bz-header-dot"></span>Strategy Templates
                    </h1>
                </div>

                <div class="p-2 flex ">
                    <!-- Sentiment Filters Section (fixed, does not scroll) -->
                    <div id="sentiment-filters" class="flex flex-row w-full gap-2 overflow-hidden" >
                        <div class="flex flex-row gap-2 overflow-x-auto no-scrollbar whitespace-nowrap text-[12px] text-gray-400 font-semibold">
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="all"> All </button>
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="bullish"> Bullish </button>
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="bearish"> Bearish </button>
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="neutral"> Neutral </button>
                        </div>

                        <div class="items-right p-1 max-w-[110px]">
                            <input
                                id="strategy-name-filter"
                                type="text"
                                placeholder="Search"
                                class="flex flex-row w-full px-2 border border-[#D8DDEF] rounded-xl text-[12px] text-black focus:outline-none focus:ring-2 focus:ring-[#00E083] focus:border-transparent"
                            />
                        </div>

                    </div>

                </div>

                <!--Strategies (only this part scrolls) -->
                <!--Strategies (only this part scrolls)
                     On phones the list is a definite 228px instead of filling the panel: a
                     collapsed card is ~35px plus the 8px gap, so that shows 5 and cuts into
                     the 6th. Landing mid-card is deliberate — .no-scrollbar hides the
                     scrollbar (styles.css), so the clipped row is the only cue that the list
                     scrolls. flex-none because an auto-height flex parent cannot size a
                     flex-1 child (its 0% basis would collapse the list); at md it goes back
                     to filling the fixed-height panel. -->
                <div id="strategy-container" class="flex flex-col gap-2 flex-none h-[228px] md:flex-1 md:h-auto min-h-0 overflow-y-auto no-scrollbar"></div>

            </div>

            <!-- Strategy Builder UI -->
            <div id="strategy-builder-board" class="hidden w-full border border-[#D8DDEF] rounded-[10px] bg-white overflow-hidden h-[70dvh] md:h-[calc(100vh_-_104px)] flex flex-col">

                <!-- Header (fixed, does not scroll) -->
                <div class="flex flex-row items-center justify-between p-2 border-b border-[#D8DDEF]">
                    <h1 class="text-[13px] tracking-[0.08em] uppercase font-semibold text-[#191308]">
                        <span class="bz-header-dot"></span>Instruments
                    </h1>
                    <button id="exit-builder" class="text-[16px] px-1 hover:bg-gray-200 rounded font-semibold text-black"> Exit</button>
                </div>

                <!-- Strategy title + add buttons (pinned, does not scroll).
                     flex-none so this keeps its natural height instead of being compressed by
                     the scroll region below it. The p-2 and gap-2 were previously inherited
                     from the scroll wrapper this block used to live in, so they are restated
                     here rather than being new styling. -->
                <div class="flex flex-col gap-2 flex-none p-2">

                    <!-- Strategy this session started from (read-only, filled by builder.js) -->
                    <div id="builder-strategy-title" class="flex flex-row items-center gap-2"></div>

                    <!-- Instrument buttons -->
                    <div class="flex flex-col-2 gap-2">
                        <button id="add-option" class="px-1 py-1 text-black bg-gray-200 rounded hover:bg-[#00E083] w-full font-semibold text-[13px] md:text-[14px]">
                            + Option
                        </button>
                        <button id="add-perp" class="px-1 py-1 text-black bg-gray-200 rounded hover:bg-[#00E083] w-full font-semibold text-[13px] md:text-[14px]">
                            + Perp
                        </button>
                    </div>

                </div>

                <!-- Instruments List (the ONLY part that scrolls).
                     Keeps p-2 because #instrument-list has no self-inset of its own, unlike
                     #menu's card list where each card carries mx-1. -->
                <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar p-2">
                    <div id="instrument-list" class="grid gap-2"></div>
                </div>

                <!-- Quote (pinned footer, does not scroll; no handler wired yet).
                     border-t mirrors the header's border-b so the scrolling list reads as
                     bounded on both ends rather than running off the panel edge. -->
                <div class="flex-none p-2 border-t border-[#D8DDEF]">
                    <button id="get-quote" class="px-1 py-1 text-black bg-gray-200 rounded hover:bg-[#00E083] w-full font-semibold text-[13px] md:text-[14px]">
                        Quote
                    </button>
                </div>

            </div>

        </div>

        <!--Chart-->
        <div class="w-full px-2 border border-[#D8DDEF] rounded-[10px] bg-white overflow-hidden h-[60dvh] md:h-[calc(100vh_-_104px)] flex flex-col">
            
                             <!-- Header (fixed, does not scroll) -->
            <div class="flex flex-row items-center justify-between p-2 border-b border-[#D8DDEF]">
                <h1 class="text-[13px] tracking-[0.08em] uppercase font-semibold text-[#191308]">
                    <span class="bz-header-dot"></span>Payoff
                </h1>
            </div>

            <!-- Token selection -->
            <div id="token-buttons" class="flex text-[12px] p-2 flex-row gap-2 text-black">
                <div>
                    <button
                        data-token="WBTC"
                        class="token-btn p-1 rounded hover:bg-gray-200 transition-colors font-semibold duration-300"
                    >
                        WBTC
                    </button>
                    <label>|</label>
                    <button
                        data-token="ETH"
                        class="token-btn p-1 rounded hover:bg-gray-200 transition-colors font-semibold duration-300"
                    >
                        ETH
                    </button>
                </div>
                <!-- Current price display-->
                <div class="current-price-display flex flex-row items-center">
                    <h2 class=" font-semibold p-1 text-black">Price :</h2>
                    <p class="text-black">#</p>
                </div>
            </div>

            <!-- Fills leftover vertical space; only the canvas grows/shrinks, legend + disclaimer stay natural height -->
            <div class="flex-1 flex flex-col min-h-0">

                <div class="flex-1 min-h-0 relative p-2">
                    <canvas id="pnlChart"></canvas>
                </div>

                <div id="strategy-legend" class="flex-none flex flex-row gap-4 p-2 text-[12px] text-black">
                    <p id="premium-disclaimer" class="text-[11px] text-gray-400 mt-1">
                        Payoff curves use estimated reference premiums for illustration only — not live market
                        prices. Actual costs and breakevens will differ. Request a quote for real pricing.
                    </p>
                </div>

            </div>

        </div>

    </section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
<script type="module" src="./mvp.js"></script>
<script type="module" src="./strategies.js"></script>
<script type="module" src="./builder.js"></script>
<script type="module" src="./charts.js"></script>
</body>
</html>
