<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" 
    content="
    Beta is a Web3 investing platform for on-chain OTC options. 
    Design, simulate, and execute custom DeFi option strategies 
    with real-time pricing and non-custodial trading.">
  <meta name="keywords" content="
    Web3 investing, 
    DeFi options, 
    OTC derivatives, 
    on-chain options, 
    smart contracts, 
    crypto hedging, 
    decentralized finance, 
    options trading, 
    blockchain trading, 
    DeFi tools
    DeFi, 
    Options, 
    Blockchain, 
    Derivatives, 
    OTC">
  <meta name="author" content="Beta Web3 Finance Team">
  <title>Beta | DeFi Options Strategy buildier </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

</head>

<body class="bg-gray-100 text-black text-[18px]">


    <!-- Navbar -->
    <div class="relative">        
        <nav id="main-navbar"
            class="static top-4 left-2 right-2 mt-2 mx-2 px-4 bg-white border border-[#D8DDEF] rounded-full flex items-center justify-between">
            <!-- Logo -->
            <a href="./index.html">
            <img src="./images/svgs/logo__black.svg" alt="Beta" class="w-16 h-12 lg:w-24 lg:h-16">
            </a>

            <div class="flex-1"></div>

            <!--Menu button -->
            <div class="md:hidden flex items-center p-2">
                <button id="mobile-menu-button" class="text-black focus:outline-none">
                <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                </button>
            </div>
        </nav>
        <!-- mobile menu -->
        <div id="mobile-menu"
            class="fixed top-[72px] left-0 right-0 mx-5 p-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl text-black font-semibold opacity-0 pointer-events-none z-40">
            <ul class="space-y-4 text-[18px]">
            <li><a target="_blank" rel="noopener noreferrer" href="https://m-mojica-mateuss-organization.gitbook.io/betazero-1/" class="px-1">Docs</a></li>
            </ul>
        </div>
    </div>
    
    <!-- Dashboard -->
    <section id="dashboard" class="grid grid-cols-[340px_minmax(0,1fr)] gap-3 p-3">

        <!-- Left column: menu options and strategy builder share this column, only one visible at a time -->
        <div>

            <!--menu options-->
            <div id="menu" class="w-full border border-[#D8DDEF] rounded-[10px] bg-white overflow-hidden h-[calc(100vh_-_104px)] flex flex-col">

                <!-- Header (fixed, does not scroll) -->
                <div class="flex flex-row items-center justify-between p-2 border-b border-[#D8DDEF]">
                    <h1 class="text-[22px] md:text-[18px] font-bold text-black">
                        Strategy Templates
                    </h1>
                </div>

                <div class="p-2 flex ">
                    <!-- Sentiment Filters Section (fixed, does not scroll) -->
                    <div id="sentiment-filters" class="flex flex-row w-full gap-2 overflow-hidden" >
                        <div class="flex flex-row gap-2 overflow-x-auto no-scrollbar whitespace-nowrap text-[12px] text-gray-400 font-semibold">
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="all"> All </button>
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="bullish"> Bullish </button>
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="bearish"> Bearish </button>
                            <button class="sentiment-filter max-h-[24px] p-1 rounded hover:bg-gray-200" data-sentiment="neutral"> Neutral </button>
                        </div>

                        <div class="items-right p-1 max-w-[110px]">
                            <input
                                id="strategy-name-filter"
                                type="text"
                                placeholder="Search"
                                class="flex flex-row w-full px-2 border border-[#D8DDEF] rounded-xl text-[12px] text-black focus:outline-none focus:ring-2 focus:ring-[#00E083] focus:border-transparent"
                            />
                        </div>

                    </div>

                </div>

                <!--Strategies (only this part scrolls) -->
                <div id="strategy-container" class="flex flex-col gap-2 flex-1 min-h-0 overflow-y-auto no-scrollbar"></div>

            </div>

            <!-- Strategy Builder UI -->
            <div id="strategy-builder-board" class="hidden w-full border border-[#D8DDEF] rounded-[10px] bg-white overflow-hidden h-[calc(100vh_-_104px)] flex flex-col">

                <!-- Header (fixed, does not scroll) -->
                <div class="flex flex-row items-center justify-between p-2 border-b border-[#D8DDEF]">
                    <h1 class="text-[22px] md:text-[18px] font-bold text-black">
                        Instruments
                    </h1>
                    <button id="exit-builder" class="text-[16px] px-1 hover:bg-gray-200 rounded font-semibold text-black"> Exit</button>
                </div>

                <!-- Instrument buttons + list (only this part scrolls) -->
                <div class="flex flex-col gap-2 flex-1 min-h-0 overflow-y-auto no-scrollbar p-2">

                    <!-- Strategy this session started from (read-only, filled by builder.js) -->
                    <div id="builder-strategy-title" class="flex flex-row items-center gap-2"></div>

                    <!-- Instrument buttons -->
                    <div class="flex flex-col-2 gap-2">
                        <button id="add-option" class="px-1 text-black bg-gray-200 rounded hover:bg-[#00E083] w-full font-semibold text-[14px]">
                            + Option
                        </button>
                        <button id="add-perp" class="px-1 text-black bg-gray-200 rounded hover:bg-[#00E083] w-full font-semibold text-[14px]">
                            + Perp
                        </button>
                    </div>

                    <!-- Quote (no handler wired yet) -->
                    <button id="get-quote" class="px-1 text-black bg-gray-200 rounded hover:bg-[#00E083] w-full font-semibold text-[14px]">
                        Quote
                    </button>

                    <!-- Instruments List -->
                    <div id="instrument-list" class="grid gap-2"></div>

                </div>

            </div>

        </div>

        <!--Chart-->
        <div class="w-full px-2 border border-[#D8DDEF] rounded-[10px] bg-white overflow-hidden h-[calc(100vh_-_104px)] flex flex-col">
            
                             <!-- Header (fixed, does not scroll) -->
            <div class="flex flex-row items-center justify-between p-2 border-b border-[#D8DDEF]">
                <h1 class="text-[22px] md:text-[18px] font-bold text-black">
                    Payoff
                </h1>
            </div>

            <!-- Token selection -->
            <div id="token-buttons" class="flex text-[12px] p-2 flex-row gap-2 text-black">
                <div>
                    <button
                        data-token="WBTC"
                        class="token-btn p-1 rounded hover:bg-gray-200 transition-colors font-semibold duration-300"
                    >
                        WBTC
                    </button>
                    <label>|</label>
                    <button
                        data-token="ETH"
                        class="token-btn p-1 rounded hover:bg-gray-200 transition-colors font-semibold duration-300"
                    >
                        ETH
                    </button>
                </div>
                <!-- Current price display-->
                <div class="current-price-display flex flex-row items-center">
                    <h2 class=" font-semibold p-1 text-black">Price :</h2>
                    <p class="text-black">#</p>
                </div>
            </div>

            <!-- Fills leftover vertical space; only the canvas grows/shrinks, legend + disclaimer stay natural height -->
            <div class="flex-1 flex flex-col min-h-0">

                <div class="flex-1 min-h-0 relative p-2">
                    <canvas id="pnlChart"></canvas>
                </div>

                <div id="strategy-legend" class="flex-none flex flex-row gap-4 p-2 text-[12px] text-black">
                    <p id="premium-disclaimer" class="text-[11px] text-gray-400 mt-1">
                        Payoff curves use estimated reference premiums for illustration only — not live market
                        prices. Actual costs and breakevens will differ. Request a quote for real pricing.
                    </p>
                </div>

            </div>

        </div>

    </section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
<script type="module" src="./mvp.js"></script>
<script type="module" src="./strategies.js"></script>
<script type="module" src="./builder.js"></script>
<script type="module" src="./charts.js"></script>
</body>
</html>
