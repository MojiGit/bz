<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" 
    content="
    Beta is a Web3 investing platform for on-chain OTC options. 
    Design, simulate, and execute custom DeFi option strategies 
    with real-time pricing and non-custodial trading.">
  <meta name="keywords" content="
    Web3 investing, 
    DeFi options, 
    OTC derivatives, 
    on-chain options, 
    smart contracts, 
    crypto hedging, 
    decentralized finance, 
    options trading, 
    blockchain trading, 
    DeFi tools
    DeFi, 
    Options, 
    Blockchain, 
    Derivatives, 
    OTC">
  <meta name="author" content="Beta Web3 Finance Team">
  <title>Beta | DeFi Options Strategy buildier </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>


</head>

<body class="bg-white text-black text-[18px]">


    <!-- Navbar -->
    <div class="relative z-50">        
        <nav id="main-navbar"
            class="fixed top-4 left-2 right-2 z-50 px-4 backdrop-blur-3xl bg-white/10 border border-[#D8DDEF] rounded-full flex items-center justify-between transition-opacity duration-500 ease-in-out opacity-100">
            <!-- Logo -->
            <a href="./index.html">
            <img src="./images/svgs/logo__black.svg" alt="Beta" class="w-16 h-12 lg:w-24 lg:h-16">
            </a>

            <div class="flex-1"></div>

            <!-- Desktop Links -->
            <ul class="space-x-6 text-black text-[16px] hidden md:flex items-center">
                    <button id="connect-wallet" class="px-4 font-bold py-2 rounded-full bg-[#00E083] rounded hover:bg-[#52FFB8]">
                    Connect
                    </button>
            </ul>

            <!--Menu button -->
            <div class="md:hidden flex items-center p-2">
                <button id="mobile-menu-button" class="text-black focus:outline-none">
                <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                </button>
            </div>
        </nav>
        <!-- mobile menu -->
        <div id="mobile-menu"
            class="fixed top-[72px] left-0 right-0 mx-5 p-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl text-black font-semibold opacity-0 pointer-events-none transition-all duration-300 ease-in-out z-40">
            <ul class="space-y-4 text-[18px]">
            <li><a href="#" class="px-1">My Strategies</a></li>
            <li><a target="_blank" rel="noopener noreferrer" href="https://m-mojica-mateuss-organization.gitbook.io/betazero-1/" class="px-1">Docs</a></li>
            <li><a href="#" target="_blank" rel="noopener noreferrer" class="hover:text-[#00E083] transition">
                    <button class="text-[16px] font-bold text-black bg-[#00E083] p-1 rounded-md hover:bg-[#52FFB8]">
                        Connect Wallet
                    </button>   
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!--section to avoid overlaping-->
    <div class="h-[80px]"></div>
    
    <!--Title section -->
    <div class="p-4 flex flex-col gap-2">
        <!--title-->
        <h1 class="text-[24px] md:text-[32px] font-bold text-black">
            Option Strategy Builder
        </h1>

    </div>

    <!-- Dashboard -->
    <section id="dashboard" class="flex flex-col justify-between md:flex-row gap-8 px-4">

        <!--menu options-->
        <div id="menu" class="w-full"> 
            <!-- Sentiment Filters Section -->
            <div id="sentiment-filters" class="flex flex-row justify-between w-full gap-8 mb-4 overflow-hidden" >
                <div class="flex flex-row gap-2 overflow-x-auto no-scrollbar whitespace-nowrap text-[16px] text-black font-semibold">
                    <button class="sentiment-filter px-1 rounded hover:bg-gray-200" data-sentiment="all"> All </button>
                    <button class="sentiment-filter px-1 rounded hover:bg-gray-200" data-sentiment="bullish"> Bullish </button>
                    <button class="sentiment-filter px-1 rounded hover:bg-gray-200" data-sentiment="bearish"> Bearish </button>
                    <button class="sentiment-filter px-1 rounded hover:bg-gray-200" data-sentiment="neutral"> Neutral </button>
                    <button id="my-strategies-btn" class=" text-[16px] px-1 bg-gray-200 rounded font-semibold text-black hidden">
                    My Strategies
                    </button>
                </div>
                 
                <div>
                    <input
                        id="strategy-name-filter"
                        type="text"
                        placeholder="Search"
                        class="w-full max-w-[150px] px-2 border border-[#D8DDEF] rounded-xl"
                    />
                </div>
                
            </div>

            <!--Strategies-->
            <div id="strategy-container" class="grid gap-4"></div>

            <!-- Saved Strategies Panel -->
            <div id="saved-strategies-panel" class="hidden mt-4 p-4 border border-[#D8DDEF] rounded-xl shadow-md bg-white">
                <div class="flex flex-row justify-between items-center mb-4">
                    <h2 class="text-[16px] font-bold mb-2">My Strategies</h2>
                    <button id="exit-saved-strategies" class="text-[16px] px-1 hover:bg-gray-200 rounded font-semibold text-black"> Templates</button>
                </div>
                <ul id="saved-strategy-list" class="flex flex-col gap-2 text-sm text-gray-800"></ul>
            </div>

        </div>
        
        <!-- Strategy Builder UI -->
        <div id="strategy-builder-board" class="hidden w-full">
            <div class="flex flex-row justify-between items-center mb-4">
                <div id="save-strategy-section" class="flex flex-row gap-2 items-center">
                    <input id="strategy-name-input" type="text" placeholder="Strategy Name" class="w-full max-w-[150px] px-2 border border-[#D8DDEF] rounded-xl" />
                </div>
                <div class="flex flex-row gap-2 items-center">                    
                    <button id="save-strategy-btn" class=" text-[16px] px-1 hover:bg-gray-200 rounded font-semibold text-black"> Save </button>
                    <label>|</label>
                    <button id="exit-builder" class="text-[16px] px-1 hover:bg-gray-200 rounded font-semibold text-black"> Exit</button>
                </div>
            </div>

            <!-- Instrument buttons -->
            <div class="flex flex-row gap-4 mb-4">
                <button id="add-option" class="px-1 text-black bg-gray-200 rounded hover:bg-[#00E083] font-semibold text-[16px]">
                    + Option
                </button>
                <button id="add-perp" class="px-1 text-black bg-gray-200 rounded hover:bg-[#00E083] font-semibold text-[16px]">
                    + Perp
                </button> 
            </div>

            <!-- Instruments List -->
            <div id="instrument-list" class="grid gap-4"></div>
            
            <div class="flex flex-row justify-between items-center py-4">
                <button id="quote-strategy-btn" class="px-1 text-black bg-gray-200 rounded hover:bg-[#00E083] font-semibold text-[16px]">
                    Quote Strategy
                </button>
            </div>

        </div>

        <!--Chart-->
        <div class="w-full max-w-[850px] px-4">
            <!-- Token selection -->
            <div id="token-buttons" class="flex flex-row gap-2 text-black justify-between">
                <div>
                    <button
                        data-token="WBTC"
                        class="token-btn text-[16px] px-1 rounded hover:bg-gray-200 transition-colors font-semibold duration-300"
                    >
                        WBTC
                    </button>
                    <label>|</label>
                    <button
                        data-token="ETH"
                        class="token-btn text-[16px] px-1 rounded hover:bg-gray-200 transition-colors font-semibold duration-300"
                    >
                        ETH
                    </button>
                </div>
                <!-- Current price display-->
                <div class="current-price-display flex flex-row items-center"> 
                    <h2 class=" font-semibold px-1 text-[16px] text-black">Underlaying Price :</h2>
                    <p class="text-black text-[16px]">#</p>
                </div>
            </div>
            
            <div class="w-full p-2">
                <canvas id="pnlChart" class="h-[600px] w-[400px]"></canvas>           
            </div>
            
        </div>


    </section>

    <!-- pre-designed strategies cards-->
    <div id="strategy-container" class="grid gap-4"></div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
<script type="module" src="./mvp.js"></script>
<script type="module" src="./strategies.js"></script>
<script type="module" src="./builder.js"></script>
<script type="module" src="./charts.js"></script>
<script type="module" src="./derive_api.js"></script>
</body>
</html>
